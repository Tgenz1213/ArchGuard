version: "2"
run:
  build-tags:
    - integration
    - e2e
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - forbidigo
    - funlen
    - gocognit
    - gocritic
    - nestif
    - noctx
    - revive
    - usetesting
    - wsl_v5
  exclusions:
    rules:
      - path: _test\.go
        linters: [funlen, gocognit, nestif]
      - path-except: ^internal/index/
        linters: [forbidigo]
  settings:
    funlen:
      lines: 60
      statements: 40
    gocognit:
      min-complexity: 30
    nestif:
      min-complexity: 4
    usetesting:
      context-background: true
      context-todo: true
      os-chdir: true
      os-mkdir-temp: true
      os-setenv: true
      os-create-temp: true
      os-temp-dir: true
    wsl_v5:
      default: none
      enable: [if, after-block]
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: print through the store's or provider's out printer (docs/arch/0015-index-diagnostic-writer.md)
        - pattern: ^os\.Stdout$
          msg: print through the store's or provider's out printer (docs/arch/0015-index-diagnostic-writer.md)
    errcheck:
      check-blank: true
    revive:
      rules:
        - name: argument-limit
          arguments: [5]
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: defer
        - name: dot-imports
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: struct-tag
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: use-any
        - name: var-declaration
        - name: var-naming
formatters:
  enable: [gci]
  settings:
    gci:
      sections: [standard, default]
