name: 'ArchGuard - Architectural Drift Detector'
description: 'Semantic compliance engine that verifies code changes against ADRs.'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  provider:
    description: 'The LLM provider configured in archguard.yaml (e.g., ollama, openai, gemini)'
    required: true
  scope:
    description: 'changed (default) checks the files the pull request or push changed; all checks every tracked file.'
    required: false
    default: 'changed'
  base:
    description: 'Commit to compare against when scope is changed. Defaults to the pull request base, or the commit before a push.'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
    
    - name: Install ArchGuard
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go install ./cmd/archguard
    
    - name: Install Ollama
      if: ${{ inputs.provider == 'ollama' }}
      shell: bash
      run: curl -fsSL https://ollama.com/install.sh | sh
    
    - name: Start Ollama and Pull Models
      if: ${{ inputs.provider == 'ollama' }}
      shell: bash
      run: |
        ollama serve &
        sleep 5
        ollama pull llama3.2
        ollama pull nomic-embed-text
    
    - name: Run ArchGuard Check
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
        BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
      run: |
        case "$SCOPE" in
          changed|all) ;;
          *) echo "scope must be 'changed' or 'all', got '$SCOPE'" >&2; exit 2 ;;
        esac

        case "$BASE" in
          -*) echo "base must be a commit, got '$BASE'" >&2; exit 2 ;;
        esac

        args=(--ci --debug)
        if [ "$SCOPE" = "changed" ] && [ -n "${BASE//0/}" ]; then
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE"
          fi

          args+=(--since "$BASE")
        else
          echo "Checking every tracked file."
          args+=(--all)
        fi

        archguard check "${args[@]}"
