name: Set up Go
description: Installs the latest patch release of the Go version go.mod declares.
outputs:
  version:
    description: The major.minor Go version read from go.mod.
    value: ${{ steps.version.outputs.go }}
runs:
  using: composite
  steps:
    - name: Read the Go version from go.mod
      id: version
      shell: bash
      run: echo "go=$(awk '/^go /{split($2, v, "."); print v[1] "." v[2]}' go.mod)" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ steps.version.outputs.go }}
