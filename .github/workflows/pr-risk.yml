name: PR Risk

# Labels and comments on each PR with its risk lane, and never fails. This is the
# only thing that approves a PR for the owner or turns on auto-merge: the gate
# GitHub App approves a green PR and it is set to squash-merge once the ruleset's
# required checks pass; on any other PR the gate's approval is dismissed and
# auto-merge is turned off. Jev can only move a PR to red, never to green
# (docs/arch/0048-only-the-green-lane-merges-without-the-owner.md).

on:
  # pull_request_target runs this file as it is on main, so a PR can't edit it to
  # merge itself. That is safe only while no step checks out or runs the PR's
  # code: read the PR through the API, never with actions/checkout.
  pull_request_target:
    branches:
      - main
    # labeled and unlabeled put back a risk label someone changed by hand;
    # auto_merge_enabled turns off auto-merge someone turned on for a PR that
    # isn't green.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, auto_merge_enabled]

permissions:
  contents: read

concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # A PR touching any red path needs the owner. Bash patterns: * also matches /.
  RED_PATHS: |
    .github/*
    .githooks/*
    .claude/*
    CLAUDE.md
    action.yml
    docs/arch/*
    docs/standards/*
    docs/ADR_TEMPLATE.md
    .goreleaser.yaml
    .golangci.yml
    go.mod
    go.sum
    LICENSE.md
    SECURITY.md
  # A PR whose every file is green may ship on CI alone.
  GREEN_PATHS: |
    README.md
    CONTRIBUTING.md
    docs/*
  JEV_MIN_CONFIDENCE: "0.7"
  JEV_DEESCALATE_CONFIDENCE: "0.85"

jobs:
  classify:
    name: Classify
    # AGENT_BOT_LOGIN is the agent's GitHub App login, e.g. archguard-bot[bot].
    if: (github.event.pull_request.user.login == github.repository_owner || github.event.pull_request.user.login == vars.AGENT_BOT_LOGIN) && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # The gate app's approval counts toward the ruleset's required approval. Its
      # key is safe here only because no step checks out or runs the PR's code.
      - name: Get the gate app's token
        id: gate
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ARCHGUARD_GATE_APP_ID }}
          private-key: ${{ secrets.ARCHGUARD_GATE_PRIVATE_KEY }}

      - name: Classify the change
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_TOKEN: ${{ steps.gate.outputs.token }}
          GATE_SLUG: ${{ steps.gate.outputs.app-slug }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -uo pipefail

          matches() {
            local pattern
            while IFS= read -r pattern; do
              # shellcheck disable=SC2053 # the pattern is a glob on purpose
              [ -n "$pattern" ] && [[ $1 == $pattern ]] && return 0
            done <<< "$2"
            return 1
          }

          above() {
            awk -v value="$1" -v bound="$2" 'BEGIN { exit !(value >= bound) }'
          }

          stats=$(gh pr view "$PR" -R "$REPO" --json files --jq '.files[] | "\(.path) +\(.additions) -\(.deletions)"')

          path_lane=green
          red_hits=""
          while IFS=' ' read -r file _; do
            [ -z "$file" ] && continue
            if matches "$file" "$RED_PATHS"; then
              path_lane=red
              red_hits+="\`$file\` "
            elif [ "$path_lane" = green ] && ! matches "$file" "$GREEN_PATHS"; then
              path_lane=yellow
            fi
          done <<< "$stats"

          tier=unavailable
          confidence=0
          if [ -n "$TYPESAFE_API_KEY" ]; then
            # Drain what head leaves so gh is not killed by SIGPIPE, which pipefail turns into a failed step.
            if diff=$(gh pr diff "$PR" -R "$REPO" | { head -c 30000; cat > /dev/null; }); then
              request=$(jq -n --arg title "$TITLE" --arg files "$stats" --arg diff "$diff" '{
                model: "jev-latest",
                state: {title: $title, changed_files: $files, diff: $diff},
                questions: {risk: {
                  type: "choice",
                  instructions: "What risk tier is this pull request to ArchGuard, a Go CLI that also ships as a GitHub Action?",
                  criteria: {
                    "very-low": "Docs, comments, formatting or a mechanical rename, with no change in behaviour",
                    "low": "A local change covered by tests that changes no CLI flag, exit code, output format, config key or Action input",
                    "medium": "Changes a CLI flag, exit code, output format, config key, Action input, cache key or a cross-package interface",
                    "high": "Could lose data, leak a secret, weaken a CI gate or ADR check, or break a public contract"
                  }
                }}
              }')
              if response=$(printf '%s' "$request" | curl -sS --fail-with-body --max-time 30 \
                -H "Authorization: Bearer $TYPESAFE_API_KEY" -H 'Content-Type: application/json' \
                --data @- https://api.typesafe.ai/v1/systemone); then
                tier=$(jq -r '.answers.risk.choice // "unavailable"' <<< "$response")
                confidence=$(jq -r '.answers.risk.confidence // 0' <<< "$response")
              else
                echo "::warning::Jev request failed: $response"
              fi
            else
              echo "::warning::Could not read the diff of PR $PR, so Jev was not asked"
            fi
          fi

          lane=$path_lane
          escalated=no
          if [ "$path_lane" != red ]; then
            case $tier in
              medium | high | unavailable) escalated=yes ;;
            esac
            above "$confidence" "$JEV_MIN_CONFIDENCE" || escalated=yes
            [ "$escalated" = yes ] && lane=red
          fi

          would_deescalate=no
          if [ "$path_lane" = yellow ] && [ "$tier" = very-low ] && above "$confidence" "$JEV_DEESCALATE_CONFIDENCE"; then
            would_deescalate=yes
          fi

          gh label create risk:green -R "$REPO" --color 2da44e --description "PR risk: may ship on CI" --force > /dev/null
          gh label create risk:yellow -R "$REPO" --color d4a72c --description "PR risk: automated review" --force > /dev/null
          gh label create risk:red -R "$REPO" --color cf222e --description "PR risk: needs the owner" --force > /dev/null
          gh pr edit "$PR" -R "$REPO" --remove-label risk:green,risk:yellow,risk:red > /dev/null 2>&1 || true
          gh pr edit "$PR" -R "$REPO" --add-label "risk:$lane" > /dev/null

          # Prints "<review id> <commit>" for each standing approval by the gate app.
          gate_approvals() {
            [ -z "$GATE_SLUG" ] && return
            gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq ".[] | select(.user.login == \"$GATE_SLUG[bot]\" and .state == \"APPROVED\") | \"\(.id) \(.commit_id)\""
          }

          approval=none
          automerge=no
          if [ "$lane" = green ]; then
            # Approve the commit that was classified; a later push makes the
            # approval stale, and this workflow runs again for it.
            if [ -z "$GATE_TOKEN" ]; then
              echo "::warning::No gate app token, so green PR $PR is not approved"
            elif grep -q " $HEAD_SHA\$" <<< "$(gate_approvals)"; then
              approval=kept
            elif GH_TOKEN=$GATE_TOKEN gh api -X POST "repos/$REPO/pulls/$PR/reviews" \
              -f event=APPROVE -f commit_id="$HEAD_SHA" \
              -f body="Green lane: every changed file is on the green path list and Jev did not escalate it." > /dev/null; then
              approval=given
            else
              echo "::warning::The gate app could not approve green PR $PR"
            fi
            if gh pr merge "$PR" -R "$REPO" --auto --squash > /dev/null 2>&1; then
              automerge=yes
            else
              echo "::warning::Could not enable auto-merge for green PR $PR"
            fi
          else
            while read -r review _; do
              [ -z "$review" ] && continue
              if gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$review/dismissals" \
                -f event=DISMISS -f message="No longer green: the lane is $lane." > /dev/null; then
                approval=dismissed
              else
                echo "::warning::Could not dismiss the gate approval $review on PR $PR"
              fi
            done < <(gate_approvals)
            gh pr merge "$PR" -R "$REPO" --disable-auto > /dev/null 2>&1 || true
          fi

          marker='<!-- pr-risk -->'
          body="$marker
          **PR risk: $lane**

          | Signal | Result |
          | --- | --- |
          | Path lane | $path_lane |
          | Jev tier | $tier (confidence $confidence) |
          | Jev escalated to red | $escalated |
          | Jev would move yellow to green (shadow) | $would_deescalate |
          | Gate approval | $approval |
          | Auto-merge on CI | $automerge |
          | Red paths touched | ${red_hits:-none} |"

          comment_id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          comment_id=${comment_id%%$'\n'*}
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" -R "$REPO" --body "$body" > /dev/null
          fi

          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
