name: Throwaway embedding input-limit probe (#228, run 2)

on:
  push:
    branches: [claude/project-thread-6x9hti]
    paths: [.github/workflows/zz-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - run: go test -tags probe -run TestProbeOversizedEmbedding -count=1 -v ./internal/inference/ 2>&1 | grep PROBE || true
