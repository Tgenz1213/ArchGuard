name: Checks

on:
  workflow_call:
    inputs:
      docker-login:
        description: Authenticate to Docker Hub before running tests
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        required: false

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go

      - name: Check go.mod and go.sum are tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error file=go.mod::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Check action.yml uses the go.mod Go version
        env:
          WANT: ${{ steps.go.outputs.version }}
        run: |
          got=$(sed -n "s/^ *go-version: *['\"]\{0,1\}\([0-9.]*\)['\"]\{0,1\} *$/\1/p" action.yml)
          if [ "$got" != "$WANT" ]; then
            echo "::error file=action.yml::action.yml sets go-version '$got' but go.mod declares Go $WANT. Update action.yml to '$WANT'."
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  unit:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run Tests
        run: go test -v -race -cover ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Log in to Docker Hub
        if: inputs.docker-login && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Integration Tests
        run: go test -v -race -tags integration ./internal/index

  e2e:
    name: E2E Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run E2E Tests
        run: go test -v -race -tags e2e ./test/e2e

  build:
    name: Verify Build
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build ArchGuard
        run: go build -v -o archguard ./cmd/archguard

  release:
    name: Release Config
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Check whether the change can affect a release
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "${BASE//0/}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit, so building every release target."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(\.goreleaser\.ya?ml|\.github/workflows/release\.yml|go\.(mod|sum)|cmd/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change to the release config, go.mod or cmd/, so skipping the release build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the release config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: check

      - name: Build every release target
        if: steps.changes.outputs.build == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean
