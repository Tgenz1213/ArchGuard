name: Vulnerabilities

on:
  workflow_call:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
