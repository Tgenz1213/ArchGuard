name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# AGENT_BOT_LOGIN is the agent's GitHub App login, e.g. archguard-bot[bot]. Its PRs
# come from branches in this repo, so they can read secrets like the owner's.

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      docker-login: ${{ github.event.pull_request.user.login == github.repository_owner || github.event.pull_request.user.login == vars.AGENT_BOT_LOGIN }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  archguard:
    name: ArchGuard
    if: github.event.pull_request.user.login == github.repository_owner || github.event.pull_request.user.login == vars.AGENT_BOT_LOGIN
    uses: ./.github/workflows/archguard.yml
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  vulnerabilities:
    name: Vulnerabilities
    uses: ./.github/workflows/vulncheck.yml

  wide-api:
    name: Wide API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      # Warns, never blocks; only a failure of the check itself fails the job.
      - name: Check the exported API of the packages many others import
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          status=0
          report=$(go run ./cmd/wideapi "$BASE" HEAD 2>&1) || status=$?
          if [ -n "$report" ]; then
            echo "::warning title=Wide API::A package many others import changed its exported API; see the job summary."
            printf '### Wide API

```
%s
```
' "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
