name: ArchGuard

on:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use the CI config
        run: cp .github/archguard-ci.yaml archguard.yaml

      - name: Restore analysis cache
        uses: actions/cache@v4
        with:
          path: .archguard/cache
          key: archguard-cache-exp-b2-${{ github.run_id }}
          restore-keys: archguard-cache-exp-b2-

      - name: Check changed files
        uses: ./
        env:
          ARCHGUARD_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          provider: gemini
